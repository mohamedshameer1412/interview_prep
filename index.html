<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Prep Tracker</title>
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: light;
    --bg:#f6f7f9; --surface:#ffffff; --subtle:#f9fafb; --border:#e4e7ec; --border2:#d0d5dd;
    --text:#101828; --text2:#344054; --muted:#667085; --faint:#98a2b3;
    --brand:#2563eb; --brand-600:#1d4ed8; --brand-50:#eff4ff; --brand-100:#dbe6fe;
    --ok:#12b76a; --ok-50:#ecfdf3; --ok-700:#027a48; --warn:#f79009; --warn-50:#fffaeb; --warn-700:#b54708; --bad:#f04438; --bad-50:#fef3f2; --bad-700:#b42318;
    --series:#2a78d6; --track:#eef0f3; --h0:#f2f4f7; --h1:#cde2fb; --h2:#86b6ef; --h3:#2a78d6; --h4:#184f95;
    --r-sm:8px; --r:12px; --r-lg:16px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05); --shadow:0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04); --shadow-lg:0 12px 24px -6px rgba(16,24,40,.12), 0 4px 8px -2px rgba(16,24,40,.06);
    --font:"Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  *, *::before, *::after { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:14.5px/1.55 var(--font); -webkit-font-smoothing:antialiased; }
  button, input, select, textarea { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  svg.i { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  /* ---------- shell ---------- */
  .app { display:grid; grid-template-columns:256px minmax(0,1fr); min-height:100vh; }
  .sidebar { position:sticky; top:0; height:100vh; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:18px 14px; gap:2px; z-index:40; }
  .brand { display:flex; align-items:center; gap:11px; padding:4px 8px 18px; }
  .brand .logo { width:34px; height:34px; border-radius:10px; background:var(--brand); display:grid; place-items:center; color:#fff; }
  .brand b { display:block; font-size:15px; font-weight:800; letter-spacing:-.01em; }
  .brand small { color:var(--muted); font-size:12px; }
  .navgroup { color:var(--faint); font-size:12px; font-weight:600; padding:14px 10px 6px; }
  .nav { display:flex; align-items:center; gap:10px; width:100%; border:0; background:transparent; color:var(--text2); font-weight:600; font-size:14px; text-align:left; padding:8px 10px; border-radius:var(--r-sm); cursor:pointer; }
  .nav:hover { background:var(--subtle); color:var(--text); }
  .nav.on { background:var(--brand-50); color:var(--brand-600); }
  .nav .count { margin-left:auto; font-size:12px; color:var(--muted); background:var(--subtle); border:1px solid var(--border); border-radius:99px; padding:0 8px; font-weight:600; }
  .nav.on .count { color:var(--brand-600); border-color:var(--brand-100); background:#fff; }
  .side-foot { margin-top:auto; display:grid; gap:10px; }
  .level { border:1px solid var(--border); border-radius:var(--r); padding:12px; background:var(--subtle); }
  .level .lv-top { display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); }
  .level b { font-size:14px; color:var(--text); }
  .main { min-width:0; display:flex; flex-direction:column; }
  .topbar { position:sticky; top:0; z-index:30; background:rgba(255,255,255,.88); backdrop-filter:saturate(1.6) blur(10px); -webkit-backdrop-filter:saturate(1.6) blur(10px); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; padding:12px clamp(16px,3vw,32px); padding-top:max(12px, env(safe-area-inset-top)); }
  .topbar h1 { font-size:18px; margin:0; font-weight:800; letter-spacing:-.015em; }
  .topbar p { margin:0; color:var(--muted); font-size:12.5px; }
  .topbar .grow { flex:1; min-width:0; }
  .btn.menu-btn { display:none; }
  .page { padding:22px clamp(16px,3vw,32px) 60px; max-width:1240px; width:100%; }
  .overlay { display:none; }
  .prow { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:4px 0; }
  .prow > :first-child { flex:1 1 180px; min-width:0; }
  .prow .btn.ghost { height:32px; padding:0 10px; font-size:13px; }
  @media (max-width:560px) {
    .topbar { flex-wrap:wrap; row-gap:8px; }
    .topbar .grow { flex:1 1 calc(100% - 56px); }
    .topbar > :last-child { flex:1 1 100%; }
    .topbar > :last-child .dd-btn { width:100%; }
  }
  @media (max-width:960px) {
    .app { grid-template-columns:minmax(0,1fr); }
    .sidebar { position:fixed; left:0; top:0; bottom:0; width:280px; transform:translateX(-102%); transition:transform .25s ease; box-shadow:var(--shadow-lg); }
    .sidebar.open { transform:none; }
    .overlay.on { display:block; position:fixed; inset:0; background:rgba(16,24,40,.35); z-index:35; }
    .btn.menu-btn { display:inline-flex; }
  }

  /* ---------- primitives ---------- */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:38px; padding:0 14px; border-radius:var(--r-sm); border:1px solid var(--border2); background:var(--surface); color:var(--text2); font-weight:600; font-size:14px; cursor:pointer; box-shadow:var(--shadow-sm); white-space:nowrap; transition:background .15s, border-color .15s; }
  .btn:hover { background:var(--subtle); }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn.primary:hover { background:var(--brand-600); border-color:var(--brand-600); }
  .btn.sm { height:32px; padding:0 11px; font-size:13px; }
  .btn.icon { width:38px; padding:0; }
  .btn.ghost { border-color:transparent; box-shadow:none; background:transparent; }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); }
  .panel-h { display:flex; align-items:center; gap:10px; padding:16px 18px 0; }
  .panel-h h2 { font-size:15px; font-weight:700; margin:0; letter-spacing:-.01em; }
  .panel-h p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  .panel-h .grow { flex:1; min-width:0; }
  .panel-b { padding:14px 18px 18px; }
  .badge { display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 9px; border-radius:99px; font-size:12px; font-weight:600; background:var(--subtle); color:var(--text2); border:1px solid var(--border); white-space:nowrap; }
  .badge.brand { background:var(--brand-50); color:var(--brand-600); border-color:var(--brand-100); }
  .badge.ok { background:var(--ok-50); color:var(--ok-700); border-color:#abefc6; }
  .badge.warn { background:var(--warn-50); color:var(--warn-700); border-color:#fedf89; }
  .badge.bad { background:var(--bad-50); color:var(--bad-700); border-color:#fecdca; }
  .badge .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .progress { height:8px; border-radius:99px; background:var(--track); overflow:hidden; }
  .progress i { display:block; height:100%; background:var(--brand); border-radius:99px; transition:width .5s cubic-bezier(.2,.8,.2,1); }
  .progress.ok i { background:var(--ok); }
  .muted { color:var(--muted); }

  /* ---------- custom checkbox ---------- */
  .cb { display:inline-flex; align-items:flex-start; gap:10px; cursor:pointer; position:relative; }
  .cb input { position:absolute; opacity:0; width:18px; height:18px; margin:0; cursor:pointer; }
  .cb .box { width:18px; height:18px; flex:none; margin-top:2px; border:1.5px solid var(--border2); border-radius:5px; background:var(--surface); display:grid; place-items:center; transition:background .15s, border-color .15s, transform .15s; }
  .cb .box svg { width:12px; height:12px; stroke:#fff; stroke-width:3; fill:none; stroke-dasharray:16; stroke-dashoffset:16; transition:stroke-dashoffset .25s ease .05s; }
  .cb input:checked + .box { background:var(--brand); border-color:var(--brand); }
  .cb input:checked + .box svg { stroke-dashoffset:0; }
  .cb input:focus-visible + .box { outline:2px solid var(--brand); outline-offset:2px; }
  .cb:active .box { transform:scale(.9); }
  .cb .lab { color:var(--text2); }
  .cb input:checked ~ .lab { color:var(--muted); text-decoration:line-through; text-decoration-color:var(--faint); }

  /* ---------- toggle ---------- */
  .toggle { display:inline-flex; align-items:center; gap:10px; cursor:pointer; border:0; background:transparent; padding:0; color:var(--text2); font-weight:600; font-size:13.5px; }
  .toggle .track { width:36px; height:20px; border-radius:99px; background:var(--border2); position:relative; transition:background .2s; flex:none; }
  .toggle .track::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(16,24,40,.25); transition:transform .25s cubic-bezier(.3,1.4,.5,1); }
  .toggle[aria-checked="true"] .track { background:var(--brand); }
  .toggle[aria-checked="true"] .track::after { transform:translateX(16px); }

  /* ---------- radio: segmented + cards + rating ---------- */
  .seg { display:inline-flex; background:var(--subtle); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px; }
  .seg label { position:relative; }
  .seg input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
  .seg span { display:block; padding:5px 12px; border-radius:7px; font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap; transition:background .15s, color .15s; }
  .seg input:checked + span { background:var(--surface); color:var(--text); box-shadow:var(--shadow); }
  .seg input:focus-visible + span { outline:2px solid var(--brand); }
  .rcards { display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .rcard { position:relative; border:1px solid var(--border); border-radius:var(--r); padding:12px 14px 12px 40px; cursor:pointer; background:var(--surface); transition:border-color .15s, box-shadow .15s; }
  .rcard input { position:absolute; opacity:0; }
  .rcard::before { content:''; position:absolute; left:14px; top:15px; width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border2); background:var(--surface); transition:border .15s; }
  .rcard:has(input:checked) { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-50); }
  .rcard:has(input:checked)::before { border:5px solid var(--brand); }
  .rcard:has(input:focus-visible) { outline:2px solid var(--brand); outline-offset:2px; }
  .rcard b { display:block; font-size:14px; }
  .rcard small { color:var(--muted); }
  .rating { display:inline-flex; gap:4px; }
  .rating label { position:relative; }
  .rating input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
  .rating span { width:30px; height:30px; display:grid; place-items:center; border-radius:8px; border:1px solid var(--border); font-size:12.5px; font-weight:700; color:var(--muted); background:var(--surface); transition:all .15s; }
  .rating label:hover span { border-color:var(--brand); color:var(--brand); }
  .rating input:checked + span, .rating .lit span { background:var(--brand); border-color:var(--brand); color:#fff; }
  .rating input:focus-visible + span { outline:2px solid var(--brand); outline-offset:2px; }

  /* ---------- dropdown / multiselect / datepicker ---------- */
  .dd { position:relative; display:inline-block; }
  .dd-btn { display:inline-flex; align-items:center; gap:8px; height:38px; padding:0 10px 0 12px; border-radius:var(--r-sm); border:1px solid var(--border2); background:var(--surface); box-shadow:var(--shadow-sm); cursor:pointer; font-size:13.5px; font-weight:600; color:var(--text2); min-width:150px; }
  .dd-btn .v { flex:1; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dd-btn .k { color:var(--muted); font-weight:500; }
  .dd-btn svg.chev { width:16px; height:16px; color:var(--muted); transition:transform .2s; }
  .dd.open .dd-btn { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-50); }
  .dd.open .dd-btn svg.chev { transform:rotate(180deg); }
  .pop { position:absolute; z-index:50; top:calc(100% + 6px); left:0; min-width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow-lg); padding:6px; animation:pop .14s ease-out; }
  .pop.right { left:auto; right:0; }
  @keyframes pop { from { opacity:0; transform:translateY(-4px); } }
  .opt { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13.5px; color:var(--text2); white-space:nowrap; }
  .opt[aria-selected="true"] { color:var(--brand-600); font-weight:700; }
  .opt.act, .opt:hover { background:var(--subtle); }
  .opt .tick { margin-left:auto; color:var(--brand); }
  .pop-foot { display:flex; justify-content:space-between; gap:8px; border-top:1px solid var(--border); margin-top:6px; padding:8px 4px 2px; }
  .cal { width:288px; padding:10px; }
  .cal-h { display:flex; align-items:center; justify-content:space-between; padding:2px 2px 8px; font-weight:700; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; }
  .cal-grid .dow { font-size:11.5px; color:var(--muted); font-weight:600; padding:4px 0; }
  .cal-grid button { height:36px; border:0; border-radius:8px; background:transparent; cursor:pointer; font-size:13px; color:var(--text2); }
  .cal-grid button:hover { background:var(--subtle); }
  .cal-grid button.out { color:var(--faint); }
  .cal-grid button.today { box-shadow:inset 0 0 0 1px var(--border2); font-weight:700; }
  .cal-grid button.sel { background:var(--brand); color:#fff; font-weight:700; }
  .cal-grid button:disabled { color:var(--border2); cursor:not-allowed; }
  .input { height:38px; border:1px solid var(--border2); border-radius:var(--r-sm); background:var(--surface); padding:0 12px 0 36px; font-size:13.5px; box-shadow:var(--shadow-sm); width:100%; }
  .input:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-50); }
  .search { position:relative; flex:1; min-width:180px; }
  .search svg { position:absolute; left:11px; top:10px; color:var(--muted); }

  /* ---------- layout pieces ---------- */
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; }
  .toolbar .sp { flex:1; }
  .kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-bottom:16px; }
  @media (max-width:1100px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:520px) { .kpis { grid-template-columns:1fr 1fr; gap:10px; } .kpi { padding:12px; } .kpi .val { font-size:24px; margin:8px 0 4px; } .kpi .lab .ic { display:none; } .kpi .note { font-size:12px; } }
  .kpi { padding:16px 18px; }
  .kpi .lab { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; font-weight:600; }
  .kpi .lab .ic { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; background:var(--brand-50); color:var(--brand); }
  .kpi .lab .ic.warn { background:var(--warn-50); color:var(--warn); }
  .kpi .lab .ic.ok { background:var(--ok-50); color:var(--ok); }
  .kpi .val { font-size:30px; font-weight:800; letter-spacing:-.02em; margin:10px 0 6px; font-variant-numeric:tabular-nums; line-height:1.1; }
  .kpi .val small { font-size:15px; color:var(--muted); font-weight:600; }
  .kpi .note { font-size:12.5px; color:var(--muted); }
  .kpi .note b { color:var(--ok-700); }
  .kpi .note b.down { color:var(--bad-700); }
  .cols { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:16px; margin-bottom:16px; }
  .cols2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
  @media (max-width:1100px) { .cols, .cols2 { grid-template-columns:minmax(0,1fr); } }
  .nba { display:flex; gap:14px; align-items:flex-start; background:linear-gradient(180deg, var(--brand-50), #fff 70%); border:1px solid var(--brand-100); border-radius:var(--r); padding:14px 16px; }
  .nba .ic { width:36px; height:36px; border-radius:10px; background:var(--brand); color:#fff; display:grid; place-items:center; flex:none; }
  .nba .t { font-weight:700; }
  .nba .grow { flex:1; min-width:0; }
  @media (max-width:560px) { .nba { flex-wrap:wrap; } .nba .grow { flex-basis:calc(100% - 52px); } .nba .btn { width:100%; } }
  .qrow { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--border); }
  .qrow:first-child { border-top:0; }
  .qrow .grow { flex:1; min-width:0; }
  .qrow .t { font-weight:600; color:var(--text); }
  .meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .goal { display:flex; align-items:center; gap:16px; }
  .goal .t { font-weight:700; font-size:16px; }
  .miles { display:grid; gap:8px; margin-top:14px; }
  .mile { display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--text2); }
  .mile .m { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; border:1.5px solid var(--border2); color:var(--faint); flex:none; }
  .mile.done .m { background:var(--ok); border-color:var(--ok); color:#fff; }
  .mile.next .m { border-color:var(--brand); color:var(--brand); }
  .mile .r { margin-left:auto; color:var(--muted); font-size:12.5px; }
  .chart h3 { margin:0; font-size:14.5px; font-weight:700; }
  .chart p { margin:2px 0 10px; color:var(--muted); font-size:12.5px; }

  /* skills list */
  .item { margin-bottom:12px; overflow:hidden; }
  .item-h { display:flex; align-items:center; gap:14px; padding:14px 18px; cursor:pointer; border:0; background:transparent; width:100%; text-align:left; }
  .item-h:hover { background:var(--subtle); }
  .item-h .grow { flex:1; min-width:0; }
  .item-h .t { font-weight:700; font-size:14.5px; color:var(--text); }
  .item-h .why { color:var(--muted); font-size:13px; margin-top:2px; }
  .item-h .pg { width:150px; flex:none; }
  .item-h .pg small { display:block; text-align:right; color:var(--muted); font-size:12px; margin-bottom:4px; font-weight:600; }
  .item-h svg.chev { width:18px; height:18px; color:var(--muted); transition:transform .2s; flex:none; }
  .item.open .item-h svg.chev { transform:rotate(180deg); }
  .item-b { display:none; padding:4px 18px 16px 18px; border-top:1px solid var(--border); }
  .item.open .item-b { display:block; }
  .tasks { display:grid; gap:8px; margin:12px 0; }
  @media (max-width:640px) { .item-h { flex-wrap:wrap; } .item-h .pg { width:100%; order:3; } }
  textarea.notes { width:100%; min-height:84px; border:1px solid var(--border2); border-radius:var(--r-sm); padding:10px 12px; font-size:13.5px; resize:vertical; background:var(--subtle); }
  textarea.notes:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-50); background:#fff; }
  .lbl { font-size:12.5px; font-weight:700; color:var(--text2); margin:10px 0 6px; }

  /* questions table */
  .qtable { width:100%; }
  .qt-row { display:grid; grid-template-columns:minmax(0,1fr) 170px auto; gap:16px; align-items:center; padding:14px 18px; border-top:1px solid var(--border); }
  .qt-row:first-child { border-top:0; }
  .qt-head { display:grid; grid-template-columns:minmax(0,1fr) 170px auto; gap:16px; padding:10px 18px; background:var(--subtle); border-bottom:1px solid var(--border); color:var(--muted); font-size:12.5px; font-weight:700; border-radius:var(--r-lg) var(--r-lg) 0 0; }
  .qt-more { grid-column:1 / -1; }
  .qt-more summary { color:var(--brand-600); font-size:13px; font-weight:600; cursor:pointer; }
  @media (max-width:760px) { .qt-row, .qt-head { grid-template-columns:1fr; gap:10px; } .qt-head { display:none; } }

  /* rounds */
  .steps { position:relative; }
  .step { display:grid; grid-template-columns:32px minmax(0,1fr); gap:14px; padding-bottom:18px; position:relative; }
  .step:not(:last-child)::before { content:''; position:absolute; left:15px; top:34px; bottom:2px; width:2px; background:var(--border); }
  .step.passed:not(:last-child)::before { background:var(--ok); }
  .step .n { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:13px; border:2px solid var(--border2); color:var(--muted); background:var(--surface); }
  .step.cur .n { border-color:var(--brand); color:var(--brand); box-shadow:0 0 0 4px var(--brand-50); }
  .step.passed .n { background:var(--ok); border-color:var(--ok); color:#fff; }

      top.append(Dropdown({ label: 'Status', align: 'right', value: st, options: [['', 'Not reached'], ['prep', 'Preparing'], ['sched', 'Scheduled'], ['passed', 'Passed'], ['no', 'Not selected']], onChange: (v) => { set(`round:${r}:${k}`, v); logAction(); if (v === 'passed') { confetti(); toast('Stage passed. On to the next one.'); } render(); } }));
      m.append(top, el('div', 'd', what)); row.append(n, m); steps.append(row);
    });
    b.append(steps, el('p', 'muted', 'Assembled from candidate reports; confirm the real process with your recruiter.')); b.lastChild.style.fontSize = '12.5px';
    grid.append(p);
  }
  app.append(grid);
}
function sources(app) {
  const [p, b] = panel('Where the reported questions and rounds come from', 'Third-party candidate reports and prep guides, not official Google material.');
  const ul = el('ul'); ul.style.cssText = 'margin:0;padding-left:18px;line-height:2';
  for (const [l, u] of SOURCES) { const li = el('li'); const a = el('a', null, l); a.href = u; a.target = '_blank'; a.rel = 'noopener'; a.style.color = 'var(--brand-600)'; li.append(a); ul.append(li); }
  b.append(ul); app.append(p);
}
function settings(app) {
  const grid = el('div', 'cols2');
  const [p1, b1] = panel('Daily goal', 'How many actions count as a full day.');
  b1.append(RadioCards([[3, 'Light', '3 actions a day'], [5, 'Steady', '5 actions a day'], [8, 'Intense', '8 actions a day']], goalN(), (v) => { set('goal', v); toast('Daily goal set to ' + v + '.'); render(); }, 'Daily goal'));

  const [p2, b2] = panel('Default answer timer', 'Coding and system design always get at least 10 minutes.');
  b2.append(RadioCards([[2, 'Quick', '2 minutes'], [3, 'Standard', '3 minutes'], [5, 'Deep', '5 minutes']], timerMin(), (v) => { set('timer', v); toast('Timer set to ' + v + ' minutes.'); }, 'Timer length'));
  grid.append(p2);
  const [p3, b3] = panel('Your data', 'Progress is saved on this device. Export it to back up or move to another device.');
  const row = el('div'); row.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap';
  const ex = el('button', 'btn', 'Export progress'); ex.type = 'button'; ex.onclick = () => { const a = el('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' })); a.download = 'prep-progress-' + today() + '.json'; a.click(); toast('Progress exported.'); };
  const im = el('button', 'btn', 'Import progress'); im.type = 'button'; im.onclick = () => { const f = el('input'); f.type = 'file'; f.accept = '.json'; f.onchange = async () => { try { S = JSON.parse(await f.files[0].text()); save(); location.reload(); } catch { toast('That file is not a progress export.'); } }; f.click(); };
  row.append(ex, im); b3.append(row); grid.append(p3);
  const [p4, b4] = panel('Preferences', '');
  b4.append(Toggle(!!get('quiet', false), 'Turn off celebrations', (v) => { set('quiet', v); toast(v ? 'Celebrations off.' : 'Celebrations on.'); }));
  grid.append(p4);
  app.append(grid);
}

// ================================================================== jobs, plan, reminders
// fit: good | stretch | later | no
const JOBS = [
  ['google-apm', 'Google', 'Associate Product Manager, University Graduate 2027', 'Bengaluru', 'stretch', '2026-11-24', 'Resume and an English transcript are required, no cover letter. Arrears show on the transcript. A start in Apr to Aug 2027 needs the degree finished.', 'https://google.com/about/careers/applications/jobs/results/101007950268506822-associate-product-manager-university-graduate-2027-start'],
  ['lji-apm', 'Loyalty Juggernaut', 'Associate Product Manager (campus hiring, 2027 batch)', 'Hyderabad', 'good', '', 'Found on a job aggregator. Confirm it is still open before applying.', 'https://scoutify.com/companies/lji/jobs/3452045/'],
  ['peoplebox-apm', 'Peoplebox', 'Associate Product Manager', 'Bengaluru', 'good', '', 'Listing says new grads are ok. Pay is shown as 12 to 15 with no unit.', 'https://www.ycombinator.com/companies/peoplebox/jobs/SZFeWUo-associate-product-manager-apm'],
  ['hyperverge-pm', 'HyperVerge', 'Product Manager Associate', 'Bengaluru', 'good', '', 'Computer vision company, so your Alpha Cloud Labs work fits. Posted Jul 2026. Experience required is not stated.', 'https://jobs.spacecapital.com/companies/hyperverge/jobs/86433464-product-manager-associate'],
  ['hcl-agentic', 'HCLTech', 'Agentic AI Engineer II, agent orchestration and RAG (campus)', 'Chennai or Greater Noida', 'good', '', 'Close to your multi-agent and RAG work. A related HCLTech campus listing targets IIT, NIT and DTU, so confirm CEG is accepted.', 'https://careers.hcltech.com/job/Campus-Competent/93547-en_US'],
  ['airkit-swe', 'Airkit', 'Software Engineering AMTS (2027 graduates)', 'Bengaluru or Hyderabad', 'stretch', '', 'Lists B.E. 2027 in Electronics as eligible. Posted Aug 2026, so it may be closed.', 'https://jobs.accel.com/companies/airkit-2/jobs/90396368-software-engineering-amts'],
  ['cisco-swe', 'Cisco', 'Software Engineer, India Engineering (2027 graduates)', 'Pan-India', 'stretch', '', 'Leans toward system programming and C. Listing came from an aggregator.', 'https://thejobcompany.co.in/frontend/job_details.php?job_id=6067'],
  ['apple-ai', 'Apple', 'Software Engineer: AI (role 200689026-0321)', 'Bengaluru', 'later', '', 'Needs a Bachelor\'s degree plus 1+ years in software and applied AI/ML. Your skills match well, so apply after you graduate.', ''],
  ['apple-aidp', 'Apple', 'Software Engineer, AI and Data Platforms (role 200692393-0321)', 'Bengaluru', 'no', '', 'Needs 3+ years of experience.', ''],
  ['google-fde', 'Google', 'Forward Deployed Engineer Intern, 2027', 'Bengaluru', 'no', '', 'Needs the penultimate year of a degree. You finish in May 2027.', ''],
  ['google-tpm', 'Google', 'Technical Program Manager', 'Bengaluru', 'no', '', 'Needs 1 year of technical program management experience.', ''],
  ['google-phd', 'Google', 'Software Engineering PhD Intern, Summer 2027', 'Bengaluru, Hyderabad, Pune', 'no', '', 'Requires being in a PhD program.', ''],
];
const FIT = { good: ['ok', 'Good fit'], stretch: ['warn', 'Stretch'], later: ['brand', 'Apply after graduating'], no: ['bad', 'Not eligible'] };
const JSTAT = [['todo', 'Not applied'], ['applied', 'Applied'], ['oa', 'Online test'], ['interview', 'Interviewing'], ['offer', 'Offer'], ['rejected', 'Rejected'], ['skip', 'Skipped']];
const daysTo = (d) => Math.ceil((new Date(d + 'T23:59:59') - new Date()) / 864e5);

const REM_SEED = [
  ['Get your transcript (Anna University portal or exam cell)', '2026-11-24T08:30'],
  ['Submit the Google APM application: resume and transcript, no cover letter', '2026-11-24T11:00'],
  ['Last chance: Google APM closes end of day', '2026-11-24T20:00'],
];
const ROUTINE_SEED = ['Arrears: 2 focused hours on one subject', 'DSA: 2 problems, explain the approach out loud first', 'Spoken English: 30 minutes (explain a project on camera)', 'Product: 1 timed product or metrics question out loud', 'Jobs: apply to 2 roles or follow up on 1', 'Review: write 3 lines on what you learned today'];
const rems = () => { if (!get('rem', null)) set('rem', REM_SEED.map(([t, at], i) => ({ id: 'r' + i, t, at, done: false, fired: false }))); return get('rem', []); };
const fmtAt = (at) => new Date(at).toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const dueNow = () => rems().filter((r) => !r.done && new Date(r.at) <= new Date());

function checkDue() {
  const list = rems(); let changed = false;
  for (const r of list) {
    if (r.done || r.fired || new Date(r.at) > new Date()) continue;
    r.fired = true; changed = true; toast('Reminder: ' + r.t);
    try { if (window.Notification && Notification.permission === 'granted') new Notification('Prep reminder', { body: r.t, icon: 'icon-192.png' }); } catch {}
  }
  if (changed) { set('rem', list); if (ui.tab === 'dash' || ui.tab === 'plan') render(); }
}
setInterval(checkDue, 30000);

function duePanel() {
  const list = rems().filter((r) => !r.done).sort((a, b) => a.at.localeCompare(b.at));
  const jobs = JOBS.filter((j) => j[5] && !['applied', 'oa', 'interview', 'offer', 'rejected', 'skip'].includes(get('job:' + j[0], j[4] === 'no' || j[4] === 'later' ? 'skip' : 'todo')));
  const [p, b] = panel('Due and coming up', 'What needs you next');
  if (!list.length && !jobs.length) { b.append(el('div', 'muted', 'Nothing due. Add a reminder in Plan and reminders.')); return p; }
  for (const j of jobs) { const n = daysTo(j[5]); const row = el('div'); row.style.cssText = 'display:flex;gap:10px;align-items:center;margin:6px 0'; row.append(el('span', 'badge ' + (n <= 1 ? 'bad' : 'warn'), n < 0 ? 'Closed' : n === 0 ? 'Today' : n + (n === 1 ? ' day left' : ' days left')), el('b', null, j[1] + ': ' + j[2])); b.append(row); }
  for (const r of list.slice(0, 4)) { const over = new Date(r.at) <= new Date(); const row = el('div'); row.style.cssText = 'display:flex;gap:10px;align-items:center;margin:6px 0'; row.append(el('span', 'badge ' + (over ? 'bad' : ''), over ? 'Due now' : fmtAt(r.at)), el('span', null, r.t)); b.append(row); }
  return p;
}

function icsExport() {
  const z = (n) => String(n).padStart(2, '0'); const f = (d) => `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}T${z(d.getHours())}${z(d.getMinutes())}00`;
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Prep Tracker//EN'];
  for (const r of rems().filter((x) => !x.done)) {
    const a = new Date(r.at), e = new Date(+a + 30 * 6e4);
    L.push('BEGIN:VEVENT', 'UID:' + r.id + '-' + r.at + '@prep-tracker', 'DTSTAMP:' + f(new Date()), 'DTSTART:' + f(a), 'DTEND:' + f(e), 'SUMMARY:' + r.t.replace(/[,;\n]/g, ' '), 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + r.t.replace(/[,;\n]/g, ' '), 'TRIGGER:-PT30M', 'END:VALARM', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  const a = el('a'); a.href = URL.createObjectURL(new Blob([L.join('\r\n')], { type: 'text/calendar' })); a.download = 'prep-reminders.ics'; a.click();
  toast('Calendar file saved. Open it to add the reminders to Google Calendar.');
}

function plan(app) {
  const cols = el('div', 'cols2');
  // daily routine
  const rt = get('routine', ROUTINE_SEED); const k = 'rt:' + today();
  const doneN = rt.filter((_, i) => get(k + i, false)).length;
  const [p1, b1] = panel('Today\'s routine', `${doneN} of ${rt.length} done. Resets every day.`);
  const tasks = el('div', 'tasks');
  rt.forEach((t, i) => {
    const row = el('div', 'prow');
    const cb = Checkbox(get(k + i, false), t, (on) => { set(k + i, on); if (on) { logAction(); toast('Done. +10 XP'); } render(); });
    const del = el('button', 'btn ghost', 'Remove'); del.type = 'button'; del.onclick = () => { set('routine', rt.filter((_, j) => j !== i)); render(); };
    row.append(cb, del); tasks.append(row);
  });
  b1.append(tasks);
  const add = el('div'); add.style.cssText = 'display:flex;gap:8px;margin-top:12px';
  const ai = el('input', 'input'); ai.style.paddingLeft = '12px'; ai.placeholder = 'Add a daily task'; ai.setAttribute('aria-label', 'New daily task');
  const ab = el('button', 'btn', 'Add'); ab.type = 'button';
  ab.onclick = () => { if (!ai.value.trim()) return; set('routine', [...rt, ai.value.trim()]); render(); };
  ai.onkeydown = (e) => { if (e.key === 'Enter') ab.onclick(); };
  add.append(ai, ab); b1.append(add); cols.append(p1);
  // reminders
  const [p2, b2] = panel('Reminders', 'Alerts appear while this app is open. Use the calendar file for alerts when it is closed.');
  const list = rems().slice().sort((a, b) => a.at.localeCompare(b.at));
  for (const r of list) {
    const row = el('div', 'prow');
    const cb = Checkbox(r.done, r.t, (on) => { const all = rems(); all.find((x) => x.id === r.id).done = on; set('rem', all); render(); }); 
    const when = el('span', 'badge ' + (!r.done && new Date(r.at) <= new Date() ? 'bad' : ''), fmtAt(r.at));
    const del = el('button', 'btn ghost', 'Remove'); del.type = 'button'; del.onclick = () => { set('rem', rems().filter((x) => x.id !== r.id)); render(); };
    row.append(cb, when, del); b2.append(row);
  }
  const f = el('div'); f.style.cssText = 'display:flex;gap:8px;margin-top:12px;flex-wrap:wrap';
  const ti = el('input', 'input'); ti.style.cssText = 'padding-left:12px;flex:2;min-width:160px'; ti.placeholder = 'New reminder'; ti.setAttribute('aria-label', 'Reminder text');
  const di = el('input', 'input'); di.type = 'datetime-local'; di.style.cssText = 'padding-left:12px;flex:1;min-width:180px'; di.setAttribute('aria-label', 'Reminder date and time');
  const rb = el('button', 'btn primary', 'Add reminder'); rb.type = 'button';
  rb.onclick = () => { if (!ti.value.trim() || !di.value) return toast('Enter text and a date and time.'); set('rem', [...rems(), { id: 'r' + Date.now(), t: ti.value.trim(), at: di.value, done: false, fired: false }]); render(); };
  f.append(ti, di, rb); b2.append(f);
  const acts = el('div'); acts.style.cssText = 'display:flex;gap:8px;margin-top:12px;flex-wrap:wrap';
  const ib = el('button', 'btn', 'Download calendar file (.ics)'); ib.type = 'button'; ib.onclick = icsExport;
  const nb = el('button', 'btn', window.Notification && Notification.permission === 'granted' ? 'Notifications on' : 'Turn on notifications'); nb.type = 'button';
  nb.onclick = async () => { if (!window.Notification) return toast('This browser does not support notifications.'); const r = await Notification.requestPermission(); toast(r === 'granted' ? 'Notifications on.' : 'Notifications blocked in the browser.'); render(); };
  acts.append(ib, nb); b2.append(acts); cols.append(p2);
  app.append(cols);
}

function jobs(app) {
  const st = (j) => get('job:' + j[0], j[4] === 'no' || j[4] === 'later' ? 'skip' : 'todo');
  const open = JOBS.filter((j) => j[4] === 'good' || j[4] === 'stretch');
  const applied = open.filter((j) => st(j) !== 'todo' && st(j) !== 'skip').length;
  const [ps, bs] = panel('Applications', `${applied} of ${open.length} open roles applied. Listings came from aggregators, so check each one is still open.`);
  const pg = el('div', 'progress ok'); const pi = el('i'); pi.style.width = (100 * applied / open.length) + '%'; pg.append(pi); bs.append(pg); app.append(ps);
  const group = (title, sub, rows) => {
    const [p, b] = panel(title, sub);
    for (const j of rows) {
      const box = el('div'); box.style.cssText = 'border-top:1px solid var(--border);padding:14px 0';
      const top = el('div'); top.style.cssText = 'display:flex;gap:10px;align-items:center;flex-wrap:wrap';
      const [fc, fl] = FIT[j[4]];
      top.append(el('b', null, j[1] + ': ' + j[2]), el('span', 'badge ' + fc, fl), el('span', 'badge', j[3]));
      if (j[5]) { const n = daysTo(j[5]); top.append(el('span', 'badge ' + (n <= 1 ? 'bad' : 'warn'), n < 0 ? 'Closed ' + j[5] : 'Closes ' + j[5] + (n === 0 ? ' (today)' : ' (' + n + (n === 1 ? ' day)' : ' days)')))); }
      box.append(top, el('div', 'muted', j[6]));
      const act = el('div'); act.style.cssText = 'display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap';
      act.append(Dropdown({ label: 'Status', options: JSTAT, value: st(j), onChange: (v) => { set('job:' + j[0], v); if (v === 'applied') { logAction(); toast('Marked as applied. +10 XP'); } render(); } }));
      if (j[7]) { const a = el('a', 'btn', 'Open posting'); a.href = j[7]; a.target = '_blank'; a.rel = 'noopener'; act.append(a); }
      box.append(act, notes('job:' + j[0])); b.append(box);
    }
    app.append(p);
  };
  group('Apply now', 'Roles that accept a B.E. student graduating in 2027.', open);
  group('Later or not eligible', 'Kept here so you know why, and when to come back.', JOBS.filter((j) => j[4] === 'later' || j[4] === 'no'));
}
checkDue();
